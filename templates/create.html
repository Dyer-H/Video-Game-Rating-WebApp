{% extends 'base.html' %}
{% block title %}Create{% endblock %}
{% block style %}<link href="/static/createstyle.css" rel="stylesheet">{% endblock %}
{% block content %}
    <div class="create-space">
        <h1>Create Rating</h1>
        <label for="name">Video Game Name:</label>
        <input type="text" name="name" id="name" maxlength="50">
        <label for="rating">Rating: <span id="slider-val"></span></label>
        <input type="range" min="0" max="10" value="5" step="0.1" id="rating">
        <button onclick="createRating()">Create</button>
        <p class="message"></p>
    </div>
    <script src="/static/createcode.js"></script>
{% endblock %}
